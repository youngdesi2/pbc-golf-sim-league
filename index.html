<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12372a">
<title>Pearl Bee Cave Winter Golf League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <div class="eyebrow">Pearl &middot; Bee Cave</div>
    <h1>Winter Golf League</h1>
    <p class="sub">Full Swing simulator &middot; 10 players &middot; 10 weeks &middot; 3-week playoff &middot; weekly skins</p>
    <div class="hero-actions">
      <a class="btn submit-link" href="submit.html" hidden>Submit a score</a>
      <button class="btn ghost" id="refresh" type="button">Refresh</button>
      <span class="stamp" id="stamp"></span>
    </div>
  </div>
</header>
<div class="banner" id="banner" hidden></div>
<nav id="tabs" class="tabs">
  <div class="wrap">
    <a href="#standings" data-tab="standings" class="on">Standings</a>
    <a href="#schedule" data-tab="schedule">Schedule</a>
    <a href="#skins" data-tab="skins">Skins</a>
    <a href="#handicaps" data-tab="handicaps">Handicaps</a>
    <a href="#playoffs" data-tab="playoffs">Playoffs</a>
    <a href="#rules" data-tab="rules">Rules</a>
  </div>
</nav>
<main class="wrap" id="view"><section class="panel"><p class="muted">Loading the leaderboard...</p></section></main>
<footer class="wrap foot">
  <a href="submit.html" class="submit-link" hidden>Submit a score</a>
  <a href="admin.html">Commissioner</a>
</footer>
<script src="config.js"></script>
<script src="engine.js"></script>
<script src="core.js"></script>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
